name: Rapport de démonstration Bull-Out (profil fictif)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generer-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier le navigateur de l'environnement CI
        run: |
          which google-chrome
          google-chrome --version
      - name: Installer le pilote de Chromium
        run: npm install --no-save --no-package-lock playwright
      - name: Exécuter les 83 réponses fictives dans le vrai moteur et imprimer les PDF
        run: node tests/generer-pdf-exemple.mjs
      - name: Publier les PDF, la capture et les données de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Bull-Out-rapports-fictifs
          path: tests/artefacts-exemple/*
          retention-days: 30
          if-no-files-found: error
